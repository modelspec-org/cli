name: CI

# Two jobs, run in parallel. The first needs only Go: formatting, vet, module
# tidiness, the tests with the race detector, and the exact coverage gate. The
# second checks the GoReleaser configuration and builds every release target.
#
# The coverage gate is `go run ./cmd/covergate cover.out`. It has no threshold to
# set: it fails unless every statement is covered. internal/covergate's tests
# parse this file and fail if the gate job or its steps become conditional, can
# fail without failing the job, stop running exactly these two commands one after
# the other, or if anything touches the cover profile in between.

# The push trigger has no path filter on purpose: every push to main gets a run
# of this workflow, which is what the release of that commit waits for.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only a pull request's superseded runs are cancelled. A run on main is never
# cancelled and never replaced: its commit's release waits for this workflow, and a
# cancelled run would make the release fail its guard. A group allows one running
# and one pending run, and a newer pending run replaces an older one, so a push to
# main gets a group of its own (its commit hash).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test, vet, race, exact coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          set -eu
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go mod tidy -diff
        run: go mod tidy -diff

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test (race, coverage profile)
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=cover.out ./...

      - name: Coverage gate (every statement)
        run: go run ./cmd/covergate cover.out

  # Packaging checks: the GoReleaser configuration is valid and every advertised
  # target builds. Runs beside the test job, so it adds no wall time.
  release-check:
    name: GoReleaser check and snapshot build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: build --snapshot --clean
